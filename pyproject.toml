[tool.poetry]
name = "habitstracker"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^6.0.2"
djangorestframework = "^3.16.1"
django-cors-headers = "^4.9.0"
python-decouple = "^3.8"
celery = "^5.6.2"
redis = "^7.2.0"
python-telegram-bot = "^22.6"
djoser = "^2.3.3"
drf-yasg = "^1.21.15"
django-filter = "^25.2"
psycopg2-binary = "^2.9.11"
python-dotenv = "^1.2.1"
tzdata = "^2025.3"
requests = "^2.32.5"


[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
pytest = "^9.0.2"
pytest-django = "^4.12.0"
factory-boy = "^3.3.3"
django-debug-toolbar = "^6.2.0"
pytest-cov = "^7.0.0"
pytest-asyncio = "^1.3.0"
pytest-mock = "^3.15.1"
pytest-xdist = "^3.8.0"


[tool.poetry.group.lint.dependencies]
mypy = "^1.19.1"
black = "^26.1.0"
isort = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''


[tool.isort]
# максимальная длина строки
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict = true
warn_unreachable = true
warn_return_any = true
exclude = 'venv'


[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["habits/tests", "users/tests", "telegram_bot/tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=telegram_bot",
    "--cov-report=html",
    "--cov-report=term-missing",
    "-p no:warnings"
]

[tool.coverage.run]
source = ["telegram_bot"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/site-packages/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod"
]